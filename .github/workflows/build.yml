name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - readme.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - readme.md
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AEDT.DGBBoxes.Converter.Cli.sln

      - name: Build
        run: dotnet build AEDT.DGBBoxes.Converter.Cli.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AEDT.DGBBoxes.Converter.Cli.sln --configuration Release --no-build
